<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run strong">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Run strong: dumbbell sessions</title>
<style>
:root{--bg:#F2F4F3;--card:#fff;--tx:#12201C;--mu:#5E6B66;--bd:rgba(18,32,28,.14);--g:#0F6E56;--gb:#DDF1E9;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1C2421;--tx:#EAF0ED;--mu:#A3B0AA;--bd:rgba(234,240,237,.16);--g:#5DCAA5;--gb:#0D3A2F;--on:#04241C}}
:root[data-theme="dark"]{--bg:#121816;--card:#1C2421;--tx:#EAF0ED;--mu:#A3B0AA;--bd:rgba(234,240,237,.16);--g:#5DCAA5;--gb:#0D3A2F;--on:#04241C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 100px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px;font-weight:650}
p{margin:0 0 12px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 14px}
button{font:inherit;cursor:pointer;color:var(--tx)}
button:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{min-height:50px;border-radius:12px;border:1px solid var(--bd);background:var(--card);padding:0 18px;font-weight:600;width:100%}
.btn.p{background:var(--g);color:var(--on);border-color:transparent}
.chips{display:flex;gap:8px;margin:0 0 12px}
.chip{flex:1;min-height:56px;border-radius:12px;border:1px solid var(--bd);background:var(--card);line-height:1.25;padding:6px 2px;font-size:13px;color:var(--mu)}
.chip b{display:block;font-size:16px;color:var(--tx)}
.chip.on{border:2px solid var(--g);background:var(--gb)}
ol,ul{margin:0 0 14px;padding-left:20px}li{margin:0 0 4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.row span:first-child{font-weight:600;min-width:44px}.row span:last-child{text-align:right;color:var(--mu)}
.stat{font-size:40px;font-weight:700;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:58px;background:none;border:0;font-size:13px;color:var(--mu);font-weight:600}
nav button.on{color:var(--g)}
#run{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;gap:8px;text-align:center;color:#fff;background:var(--ph);padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);transition:background .25s}
#run .bar{height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
#run .bar i{display:block;height:100%;width:0;background:#fff}
#tm{font-size:min(24vw,104px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#nm{font-size:28px;font-weight:700;line-height:1.2;margin:10px 0 8px}
#cu{font-size:17px;opacity:.92;max-width:420px;margin:0 auto}
#sw{display:inline-block;margin-top:14px;background:#fff;color:#12201C;border-radius:20px;padding:4px 14px;font-weight:700}
.rb{display:flex;gap:10px}
.rb button{flex:1;min-height:54px;border-radius:12px;border:0;background:rgba(255,255,255,.2);color:#fff;font-weight:700}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:12px;padding:12px 16px;text-align:center;font-weight:600;z-index:5}
.fg{display:block;width:100%;height:100%;color:inherit}
.fg polyline,.fg line{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg .gd{stroke-width:1.5;opacity:.4}.fg .l2{opacity:.5}.fg .h{fill:none;stroke:currentColor;stroke-width:3}.fg .d,.fg .d2{fill:currentColor}.fg .bn{fill:currentColor;opacity:.25;stroke:none}
#fgw{height:min(26vh,190px);aspect-ratio:1;margin:0 auto 4px}#fgw:empty{display:none}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mg .card{margin:0;padding:12px}.mg .fg{height:auto;aspect-ratio:1;background:var(--bg);border-radius:10px;color:var(--tx)}
a{color:var(--g);font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){#run{transition:none}}
</style></head><body>
<main id="app" class="wrap"></main>
<nav><button data-t="today" class="on">Today</button><button data-t="moves">Moves</button><button data-t="plan">Plan</button><button data-t="log">Log</button></nav>
<div id="toast" hidden></div>
<section id="run" hidden aria-live="polite">
<div><div class="bar"><i id="pb"></i></div><p id="lb" style="margin:12px 0 0;font-weight:600;font-size:15px"></p></div>
<div><div id="fgw"></div><div id="tm">0</div><div id="nm"></div><div id="cu"></div><div id="sw" hidden></div></div>
<div><p id="nx" style="font-size:15px;opacity:.9;margin:0 0 12px"></p>
<div class="rb"><button id="bp">Pause</button><button id="bs">Skip</button><button id="be">End</button></div></div>
</section>
<script>
var EX={lunge:{n:'Goblet reverse lunge',c:'Step back, front shin vertical. Alternate legs.'},press:{n:'Dumbbell floor press',c:'Elbows about 45° from your body. Touch upper arms to the floor.'},rdl:{n:'Single-leg Romanian deadlift',c:'Hinge at the hip, flat back, hips square. Alternate legs.'},row:{n:'One-arm row',c:'Flat back, pull the weight to your hip.',sw:'Switch arms'},step:{n:'Dumbbell step-ups',c:'Drive through the heel, stand tall at the top. Alternate legs.'},ohp:{n:'Standing shoulder press',c:'Ribs down, no leaning back, press straight up.'},calf:{n:'Single-leg calf raise',c:'Pause at the top, lower slowly.',sw:'Switch legs'},fly:{n:'Bent-over reverse fly',c:'Hinge forward, soft elbows. Raise your arms out to the sides and squeeze your shoulder blades.'}};
var SES={A:['lunge','press','rdl','row','step','ohp'],B:['step','row','calf','ohp','rdl','fly']};
var WK=[[2,'Light weights, focus on form'],[3,'Same weights'],[3,'One step heavier'],[2,'Recovery week, go lighter']];
var WARM=[['Leg swings','Swing each leg front to back, then side to side.'],['Bodyweight squats','Slow and controlled, full range.'],['Arm circles','Big circles, forward then back.']];
var DAYS=[['Mon','Intervals'],['Tue','Easy run + Session A'],['Wed','Easy run or rest'],['Thu','Tempo'],['Fri','Easy run + Session B'],['Sat','Rest'],['Sun','Long run']];
var PH={warm:'#3B4C7A',work:'#0F6E56',rest:'#8A5A12'};
EX.step.b='<rect class="bn" x="58" y="80" width="36" height="12"/>';
EX.row.b='<rect class="bn" x="16" y="74" width="34" height="18"/><polyline points="28,52 28,74"/>';
EX.calf.ft=EX.lunge.ft=EX.rdl.ft=EX.ohp.ft=1;EX.fly.mir=1;
var POSE={
lunge:[[50,26,50,34,50,56,51,74,53,92,49,74,47,92,56,45,55,38],[48,38,48,46,48,68,60,70,60,92,42,84,30,90,54,54,54,47]],
press:[[22,86,32,86,58,86,72,76,78,88,70,76,76,88,45,87,46,72],[22,86,32,86,58,86,72,76,78,88,70,76,76,88,32,70,32,54]],
rdl:[[50,26,50,34,50,56,51,74,53,92,49,74,47,92,51,46,51,58],[70,47,62,48,40,56,41,74,42,92,22,56,5,57,62,60,62,72]],
row:[[19,51,28,52,50,50,58,70,60,92,44,68,32,72,28,64,28,76],[19,51,28,52,50,50,58,70,60,92,44,68,32,72,40,50,38,62]],
step:[[52,26,52,34,52,56,66,66,66,80,51,74,49,92,52,46,52,58],[66,14,66,22,66,44,66,62,68,80,72,54,72,68,66,34,66,46]],
ohp:[[50,26,50,34,50,56,51,74,53,92,49,74,47,92,56,45,56,36],[48,26,50,34,50,56,51,74,53,92,49,74,47,92,57,21,57,7]],
calf:[[50,26,50,34,50,56,51,74,53,92,44,74,37,82,51,46,51,58],[50,19,50,27,50,49,51,67,53,85,44,67,37,75,51,39,51,51]],
fly:[[50,36,50,44,50,60,55,76,57,92,45,76,43,92,55,54,56,66],[50,36,50,44,50,60,55,76,57,92,45,76,43,92,64,45,77,47]]};
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function fig(id){var e=EX[id];return '<svg class="fg" data-id="'+id+'" viewBox="0 0 100 100" role="img" aria-label="'+e.n+' animation"><line x1="4" y1="92" x2="96" y2="92" class="gd"/>'+(e.b||'')+'<polyline class="t"/><polyline class="l2"/><polyline class="l1"/><polyline class="ft"/><polyline class="a"/><circle class="h" r="5"/><rect class="d" width="9" height="3.6" rx="1.2"/><polyline class="a2"/><rect class="d2" width="9" height="3.6" rx="1.2"/></svg>'}
function draw(s,q){var e=EX[s.dataset.id];function pl(c,a){s.querySelector(c).setAttribute('points',a.join(' '))}
pl('.t',[q[2]+','+q[3],q[4]+','+q[5]]);pl('.l1',[q[4]+','+q[5],q[6]+','+q[7],q[8]+','+q[9]]);pl('.l2',[q[4]+','+q[5],q[10]+','+q[11],q[12]+','+q[13]]);pl('.a',[q[2]+','+q[3],q[14]+','+q[15],q[16]+','+q[17]]);pl('.ft',e.ft?[q[8]+','+q[9],(q[8]+6)+',92']:[]);
var h=s.querySelector('.h');h.setAttribute('cx',q[0]);h.setAttribute('cy',q[1]);var d=s.querySelector('.d');d.setAttribute('x',q[16]-4.5);d.setAttribute('y',q[17]-1.8);var d2=s.querySelector('.d2');if(e.mir){pl('.a2',[q[2]+','+q[3],(2*q[2]-q[14])+','+q[15],(2*q[2]-q[16])+','+q[17]]);d2.style.display='';d2.setAttribute('x',2*q[2]-q[16]-4.5);d2.setAttribute('y',q[17]-1.8)}else{pl('.a2',[]);d2.style.display='none'}}
function frame(t){var k=RM?.5:(1-Math.cos(t/2600*2*Math.PI))/2;document.querySelectorAll('svg.fg').forEach(function(s){var p=POSE[s.dataset.id];if(!p)return;draw(s,p[0].map(function(v,i){return v+(p[1][i]-v)*k}))});requestAnimationFrame(frame)}
var S={week:0,log:[]},tab='today',$=function(s){return document.querySelector(s)};
try{var raw=localStorage.getItem('rs1');if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem('rs1',JSON.stringify(S))}catch(e){}}
function mins(){var R=WK[S.week][0];return Math.round((120+R*240+(R*6-1)*20)/60)}
function weekCount(){return S.log.filter(function(l){return l.d>Date.now()-6048e5}).length}
function fmt(d){return new Date(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function render(){
  var h='';
  if(tab==='today'){
    h+='<h1>Dumbbell sessions</h1><p class="mu">Twice a week, built for runners.</p>';
    h+='<div class="card"><div class="stat">'+weekCount()+' of 2</div><p class="mu" style="margin:6px 0 0">sessions done in the last 7 days</p></div>';
    h+='<h2>Training week</h2><div class="chips">'+WK.map(function(w,i){return '<button class="chip'+(i===S.week?' on':'')+'" data-w="'+i+'">Week '+(i+1)+'<b>'+w[0]+' rounds</b></button>'}).join('')+'</div>';
    h+='<p class="mu">'+WK[S.week][1]+'.</p>';
    ['A','B'].forEach(function(k){
      h+='<div class="card"><h2>Session '+k+'</h2><p class="mu">About '+mins()+' min: 2 min warm-up, then '+WK[S.week][0]+' rounds of 6 moves. 40 sec work, 20 sec rest.</p><ol>'+SES[k].map(function(e){return '<li>'+EX[e].n+'</li>'}).join('')+'</ol><button class="btn p" data-s="'+k+'">Start session '+k+'</button></div>';
    });
  }else if(tab==='moves'){
    h+='<h1>Move guide</h1><p class="mu">Each move loops so you can see the motion. Tap See photos for real examples.</p><div class="mg">'+Object.keys(EX).map(function(k){var e=EX[k];return '<div class="card">'+fig(k)+'<h2 style="font-size:15px;margin:8px 0 4px">'+e.n+'</h2><p class="mu" style="margin:0 0 6px">'+e.c+'</p><a href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(e.n+' dumbbell form')+'" target="_blank" rel="noopener">See photos</a></div>'}).join('')+'</div>';
  }else if(tab==='plan'){
    h+='<h1>Weekly plan</h1><p class="mu">Put each session on an easy day, with an easy or rest day after it.</p><div class="card">'+DAYS.map(function(d){return '<div class="row"><span>'+d[0]+'</span><span>'+d[1]+'</span></div>'}).join('')+'</div>';
    h+='<div class="card"><h2>Watch for</h2><ul><li>Sore legs that carry into your next hard run: cut a round or go lighter.</li><li>Sharp pain in the knee, Achilles, or hip: stop that move and skip it.</li><li>Two weeks before a race: one light session of 2 rounds per week.</li></ul></div>';
    h+='<div class="card"><h2>Choosing weights</h2><p class="mu" style="margin:0">Pick a weight where the last 3 to 4 reps are hard but your form stays clean.</p></div>';
  }else{
    h+='<h1>Log</h1><p class="mu">Finished sessions appear here.</p>';
    if(!S.log.length)h+='<div class="card"><p style="margin:0">No sessions yet. Start session A on the Today tab.</p></div>';
    else{h+='<div class="card">'+S.log.slice(0,30).map(function(l){return '<div class="row"><span>'+fmt(l.d)+'</span><span>Session '+l.s+', '+l.r+' rounds</span></div>'}).join('')+'</div><button class="btn" id="clr">Clear log</button>'}
  }
  $('#app').innerHTML=h;
}
var steps=[],idx=0,cur=null,end=0,remain=0,paused=false,timer=null,last=-1,sess='A',ac=null,wl=null;
function beep(f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15);if(navigator.vibrate)navigator.vibrate(60)}catch(e){}}
function build(k){
  steps=[];var R=WK[S.week][0];
  WARM.forEach(function(w,i){steps.push({ph:'warm',n:w[0],c:w[1],d:40,lab:'Warm-up '+(i+1)+' of 3'})});
  for(var r=1;r<=R;r++)SES[k].forEach(function(id,i){
    var e=EX[id];steps.push({ph:'work',id:id,n:e.n,c:e.c,d:40,sw:e.sw,lab:'Round '+r+' of '+R+', move '+(i+1)+' of 6'});
    if(!(r===R&&i===5))steps.push({ph:'rest',n:'Rest',c:'Shake it out and get ready.',d:20,lab:'Round '+r+' of '+R});
  });
}
function nextName(i){for(var j=i+1;j<steps.length;j++)if(steps[j].ph!=='rest')return steps[j].n;return 'Finish'}
function nextId(i){for(var j=i+1;j<steps.length;j++)if(steps[j].ph==='work')return steps[j].id;return ''}
function start(k){
  sess=k;build(k);$('#run').hidden=false;beep(660);
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}
  paused=false;$('#bp').textContent='Pause';go(0);clearInterval(timer);timer=setInterval(tick,200);
}
function go(i){
  if(i>=steps.length)return done();
  idx=i;cur=steps[i];remain=cur.d*1000;end=Date.now()+remain;last=-1;
  $('#run').style.setProperty('--ph',PH[cur.ph]);
  $('#nm').textContent=cur.n;$('#cu').textContent=cur.c;$('#lb').textContent=cur.lab;
  $('#nx').textContent='Next: '+nextName(i);$('#sw').hidden=true;var fid=cur.ph==='work'?cur.id:(cur.ph==='rest'?nextId(i):'');$('#fgw').innerHTML=fid?fig(fid):'';$('#fgw').style.opacity=cur.ph==='rest'?.6:1;
  $('#pb').style.width=Math.round(i/steps.length*100)+'%';
  if(i>0)beep(cur.ph==='work'?880:cur.ph==='rest'?440:660);
  upd();
}
function upd(){
  var s=Math.ceil(remain/1000);$('#tm').textContent=s;
  if(cur.sw&&remain<=20000){$('#sw').textContent=cur.sw;$('#sw').hidden=false}
  if(s<=3&&s>0&&s!==last){last=s;beep(520)}
}
function tick(){if(paused)return;remain=end-Date.now();if(remain<=0)return go(idx+1);upd()}
function stop(){clearInterval(timer);$('#run').hidden=true;try{if(wl){wl.release();wl=null}}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;setTimeout(function(){t.hidden=true},3000)}
function done(){stop();S.log.unshift({d:Date.now(),s:sess,r:WK[S.week][0]});save();tab='log';setNav();render();toast('Session '+sess+' logged. Nice work.')}
requestAnimationFrame(frame);
$('#bp').onclick=function(){if(paused){paused=false;end=Date.now()+remain;this.textContent='Pause'}else{paused=true;remain=end-Date.now();this.textContent='Resume'}};
$('#bs').onclick=function(){paused=false;$('#bp').textContent='Pause';go(idx+1)};
$('#be').onclick=function(){var b=this;if(b.dataset.arm){clearTimeout(b.tm);b.dataset.arm='';b.textContent='End';stop()}else{b.dataset.arm=1;b.textContent='Tap again to end';b.tm=setTimeout(function(){b.dataset.arm='';b.textContent='End'},3000)}};
function setNav(){document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)})}
document.querySelector('nav').onclick=function(e){var t=e.target.dataset.t;if(t){tab=t;setNav();render();window.scrollTo(0,0)}};
$('#app').onclick=function(e){
  var d=e.target.closest('button');if(!d)return;
  if(d.dataset.w!==undefined){S.week=+d.dataset.w;save();render()}
  else if(d.dataset.s)start(d.dataset.s);
  else if(d.id==='clr'){if(d.dataset.arm){S.log=[];save();render()}else{d.dataset.arm=1;d.textContent='Tap again to clear'}}
};
render();
</script><script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script></body></html>
